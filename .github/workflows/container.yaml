name: Build libs2e.so container image
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Build container image
        run: |
          set -x
          podman build -t s2e-build .

      - name: Build guest tools in container image
        run: |
          set -x
          # Same image and clang version as s2e build (s2e_env/commands/build.py)
          podman build -f Dockerfile.tools --target s2e-build-env-tools -t s2e-build-env-tools .

          mkdir -p $HOME/s2e/env/build
          cd $HOME/s2e/env/build
          podman run --rm -e SYSTEM_CLANG_VERSION=15 -e S2E_PREFIX="$HOME/s2e/env/install" -w "$(pwd)" \
              -v "$HOME:$HOME" s2e-build-env-tools make -f "$GITHUB_WORKSPACE/Makefile.tools" install

      - run: echo "🍏 This job's status is ${{ job.status }}."
