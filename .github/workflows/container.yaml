name: Build libs2e.so container image
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Build container image
        run: |
          set -x
          podman build -t s2e-build .

      - name: Build guest tools in container image
        run: |
          set -x
          podman build --target s2e-build-env -t s2e-build-env .

          mkdir -p $HOME/s2e/env/build
          cd $HOME/s2e/env/build
          podman run --rm -e S2E_PREFIX="$HOME/s2e/env/install" -w "$(pwd)" -v "$HOME:$HOME" \
              s2e-build-env make -f "$GITHUB_WORKSPACE/Makefile.tools" install

      - run: echo "🍏 This job's status is ${{ job.status }}."
